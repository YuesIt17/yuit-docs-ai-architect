name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Publish the repository contents to the gh-pages branch (classic Pages flow).
# First run: Settings → Pages → Source: Deploy from branch → gh-pages / (root)

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .
          exclude_assets: .github
